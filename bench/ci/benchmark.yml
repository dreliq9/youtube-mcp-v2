# Deterministic YouTube-MCP Bench job with per-suite regression thresholds.
#
# Ready to install: `git mv bench/ci/benchmark.yml .github/workflows/benchmark.yml`
# (pushing workflow files needs a token with the `workflow` scope). Until then the
# same suite and thresholds are enforced by tests/test_benchmark_suites.py in the
# existing unit CI job.
name: Benchmark

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  deterministic:
    name: YouTube-MCP Bench (deterministic, no network)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile harness
        run: python -m compileall -q bench
      - name: Run deterministic suite with per-suite thresholds
        run: python bench/run.py --check-thresholds bench/thresholds.json
      - name: Job summary
        if: always()
        run: cat bench/results/latest.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-deterministic
          path: bench/results/
          if-no-files-found: warn
