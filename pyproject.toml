[project]
name = "youtube-mcp-v2"
version = "0.2.1"
description = "Evidence-grade, domain-neutral research over knowledge encoded in YouTube video"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0,<3",
    "python-dotenv>=1.0,<2",
    "youtube-transcript-api>=1.1,<2",
    "httpx>=0.27,<1",
    "beautifulsoup4>=4.13,<5",
]

[project.optional-dependencies]
api = ["google-api-python-client>=2.0"]
# FastEmbed 0.8 keeps semantic retrieval local/portable through ONNX Runtime
# without making model inference a core dependency for lexical-only installs.
semantic = ["fastembed>=0.8,<0.9"]
# Keep the legacy `frame` extra working while giving media extraction a name
# that accurately covers both frame.get and audio.get.
frame = ["yt-dlp>=2024.1"]
audio = ["yt-dlp>=2024.1"]
media = ["yt-dlp>=2024.1"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
youtube-mcp-v2 = "youtube_mcp_v2.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["youtube_mcp_v2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: tests that access live upstream services",
    "slow: tests that invoke media download or extraction",
]
