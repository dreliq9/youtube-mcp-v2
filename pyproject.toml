[project]
name = "youtube-mcp-v2"
version = "0.2.0"
description = "Disciplined YouTube MCP — skeleton-first research, validated transcripts, frame extraction, versioned cache"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.9",
    "youtube-transcript-api>=1.1",
    "httpx>=0.27",
    "beautifulsoup4>=4.13",
]

[project.optional-dependencies]
api = ["google-api-python-client>=2.0"]
frame = ["yt-dlp>=2024.1"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
youtube-mcp-v2 = "youtube_mcp_v2.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["youtube_mcp_v2*"]
